tips:
  latitude: "Geographic latitude in decimal degrees (-90 to 90). Southern hemisphere uses negative values. Example: São Paulo = -23.55"
  longitude: "Geographic longitude in decimal degrees (-180 to 180). Western hemisphere uses negative values. Example: São Paulo = -46.63"
  radius: "Buffer radius in meters around the coordinate. Defines the circular area of analysis.\n\nRecommendations:\n• Urban analysis: 1,000 – 5,000 m\n• Watershed studies: 5,000 – 50,000 m\n• Regional analysis: 10,000 – 100,000 m\n\nLarger radii require more processing time and data."
  source_remote: "Cloud-hosted datasets downloaded on demand. Only the area within your buffer is fetched, not the entire global dataset. Requires internet connection."
  source_local: "Use a raster file (GeoTIFF, .tif) already downloaded to your computer. Useful for datasets that require manual download or custom data."
  legend: "The classification scheme that maps pixel values to land-cover categories. Use 'Auto-detect' when the legend matches the file name, or select manually."
  year: "Analysis year. Only applies to multi-temporal datasets like MapBiomas (1985-2023). The raster file must correspond to the selected year."
  shannon: "Shannon Diversity Index (SHDI) measures the diversity of land-cover classes.\n\nInterpretation:\n• 0 = Only one class present (no diversity)\n• Higher values = More classes, more evenly distributed\n• Typical range: 0.5 – 2.5\n\nUseful for comparing landscape complexity between areas."
  simpson: "Simpson Diversity Index (SIDI) represents the probability that two randomly selected pixels belong to different classes.\n\nInterpretation:\n• 0 = Only one class (no diversity)\n• Closer to 1 = High diversity\n• Less sensitive to rare classes than Shannon"
  dominance: "Dominance measures how far the landscape is from maximum diversity.\n\nInterpretation:\n• 0 = All classes equally represented\n• Higher values = One or few classes dominate\n• Useful for detecting monoculture or urbanization pressure"
  evenness: "Evenness (Equitability) indicates how evenly distributed the area is among the classes present.\n\nInterpretation:\n• 0 = Highly unequal distribution\n• 1 = All classes occupy equal areas\n• Normalized version of Shannon (independent of number of classes)"
  patches: "Number of Patches (NP) counts the separate fragments of each land-cover class.\n\nInterpretation:\n• More patches = More fragmented landscape\n• Fewer patches = More contiguous cover\n• Important indicator for habitat connectivity and biodiversity"
  patch_density: "Patch Density is the number of patches per square kilometer.\n\nInterpretation:\n• Higher values = More fragmented\n• Important for wildlife corridor planning\n• Compare across areas of different sizes"
  lpi: "Largest Patch Index (LPI) is the percentage of the landscape occupied by the single largest patch.\n\nInterpretation:\n• 100% = Entire area is one class\n• Low values = No single class dominates spatially\n• Key indicator for habitat area requirements"
  edge_density: "Edge Density measures the total length of edges (boundaries between classes) per hectare.\n\nInterpretation:\n• Higher values = More complex boundaries\n• Related to ecotone effects and edge habitats\n• Sensitive to raster resolution"
  mesh_size: "Effective Mesh Size (MESH) quantifies landscape connectivity.\n\nInterpretation:\n• Represents the expected area accessible to an organism placed randomly\n• Higher values = Less fragmented, more connected\n• Important for conservation planning"
  aggregation_index: "The Aggregation Index (AI) measures how adjacent same-class pixels are to one another.\n\nInterpretation:\n• 0% = fully dispersed classes (checkerboard pattern)\n• 100% = fully aggregated classes (single compact block)\n• High values = compact, weakly fragmented landscape\n• Complements LPI and Patch Density"
  contagion: "Contagion (CONTAG) jointly measures class dispersion and interspersion based on adjacency probabilities.\n\nInterpretation:\n• High values = few dominant classes forming large aggregates\n• Low values = many interwoven classes in small fragments\n• Widely used in landscape ecology to characterize spatial structure"
  mean_shape_index: "The Mean Shape Index (SHAPE_MN) measures the average complexity of patches relative to a square shape.\n\nInterpretation:\n• 1.0 = perfectly square/compact patches\n• Higher values = more elongated or irregular shapes\n• Useful for identifying complex edges and habitats with more dispersed geometry"
  largest_patch_area: "Largest Patch Area (AREA_MX) — absolute size, in hectares, of the single largest patch across all classes.\n\nInterpretation:\n• High values = at least one large contiguous block (important for species requiring large habitat areas).\n• Complements LPI, which is the same quantity as % of landscape."
  smallest_patch_area: "Smallest Patch Area (AREA_MN) — size, in hectares, of the smallest detected patch in the landscape.\n\nInterpretation:\n• Very low values indicate residual/isolated fragments.\n• Useful for detecting insularization and degradation effects."
  isa_index: "Impervious Surface Area (ISA) Index — Walsh et al. (2005).\n\nMeasures the fraction of the landscape covered by impervious surfaces (urban areas, roads, rooftops).\n\nWatershed thresholds (Walsh et al. 2005):\n• < 2%  — Reference watershed (near-pristine hydrology)\n• 2–10% — Sensitive watershed (measurable hydrological alteration)\n• 10–25% — Impacted watershed (significant degradation)\n• > 25% — Severely degraded watershed\n\nHigh ISA values are strongly linked to increased stormwater runoff, stream flashiness, and biodiversity loss (the 'urban stream syndrome').\n\nReference: Walsh, C.J. et al. (2005). The urban stream syndrome: current knowledge and the search for a cure. Journal of the North American Benthological Society, 24(3), 706–723."
  smallest_patch_pixel_bias: "⚠ The smallest patch detected (~{pixel_m:.0f} m side) may equal a single pixel. This value may reflect the raster resolution rather than a real landscape fragment."
  mean_patch_area: "Mean Patch Area (AREA_MEAN) — arithmetic mean patch size, in hectares, across all patches in the landscape.\n\nInterpretation:\n• High values = patches are on average large (low fragmentation).\n• Low values = many small patches (high fragmentation).\n• Complements Patch Density and SHAPE_MN."
  transition_matrix: "The Transition Matrix shows how land cover changed between two dates.\n\nRows = class at time 1, Columns = class at time 2.\nDiagonal values = area that remained unchanged (persistence).\nOff-diagonal = area that transitioned from one class to another."
  fao_rate: "FAO Annual Deforestation Rate: r = 1 - (A₂/A₁)^(1/(t₂-t₁))\n\nThe standard metric used by the Food and Agriculture Organization to quantify annual forest loss.\n\nInterpretation:\n• 0% = No change\n• Positive = Forest loss\n• Negative = Forest gain (reforestation)"

report:
  title: "Land Use & Land Cover Analysis Report"
  generated_by: "Generated by LUMA v{version}"
  authors: "Authors: Adriano Marques Gonçalves & Guilherme Rossi Gorni (UNIARA)"
  date: "Date"
  parameters: "Analysis Parameters"
  center_coord: "Center Coordinate"
  buffer_radius: "Buffer Radius"
  buffer_area: "Buffer Area"
  data_source: "Data Source"
  geometry: "Geometry"
  polygon: "Polygon"
  geometry_area: "Geometry Area"
  collection: "Collection"
  year: "Year"
  crs: "CRS"
  resolution: "Resolution"
  accuracy: "Reported Accuracy"
  results_section: "Land Cover Distribution"
  metrics_section: "Landscape Metrics"
  quality_section: "Data Quality"
  interpretation: "Interpretation Guide"
  interpretation_text: "The Shannon Diversity Index (SHDI) measures class diversity — values above 1.5 indicate high landscape heterogeneity. The Largest Patch Index (LPI) shows spatial dominance — values above 50% suggest one class dominates the landscape. Edge Density reflects boundary complexity — higher values indicate more fragmented transitions between cover types. Patch Density quantifies fragmentation intensity — compare across sites to assess relative habitat continuity. The Aggregation Index (AI) and Contagion (CONTAG) describe how clumped or interspersed the classes are — high values indicate compact, well-aggregated landscapes. The Mean Shape Index (SHAPE_MN) characterizes patch geometry — values close to 1.0 indicate compact patches, while higher values reveal irregular or elongated shapes."
  temporal_section: "Temporal Analysis"
  temporal_period: "Period: {year1} → {year2}"
  temporal_persistence: "Persistence"
  temporal_net_change: "Net Change by Class"
  temporal_transition: "Transition Matrix (km²)"
  temporal_from: "From \\ To"
  compare_section: "Multi-Point Comparison"
  compare_class_pct: "Class Distribution (%)"
  compare_metrics: "Landscape Metrics by Point"
  compare_area: "Area (km²)"
  metric_detail_title: "Metric Descriptions & Calculation Basis"
  metric_detail_shannon: "<b>Shannon Diversity Index (SHDI)</b><br/>Formula: SHDI = −Σ(pᵢ × ln pᵢ), where pᵢ is the proportion of landscape occupied by class i.<br/>Range: 0 (single class) to ln(n) (maximum diversity with n classes).<br/>Interpretation: Values above 1.5 indicate high landscape heterogeneity. Useful for comparing landscape complexity across different sites or time periods.<br/>Reference: Shannon, C.E. (1948). A Mathematical Theory of Communication. <i>Bell System Technical Journal</i>, 27, 379–423."
  metric_detail_simpson: "<b>Simpson Diversity Index (SIDI)</b><br/>Formula: SIDI = 1 − Σ(pᵢ²), where pᵢ is the proportion of landscape occupied by class i.<br/>Range: 0 (single class) to 1 − 1/n (maximum diversity).<br/>Interpretation: Represents the probability that two randomly selected pixels belong to different classes. Less sensitive to rare classes than Shannon. Values above 0.7 indicate high diversity.<br/>Reference: Simpson, E.H. (1949). Measurement of Diversity. <i>Nature</i>, 163, 688."
  metric_detail_dominance: "<b>Dominance</b><br/>Formula: D = ln(n) − SHDI, where n is the number of classes.<br/>Range: 0 (all classes equally represented) to ln(n) (one class occupies 100%).<br/>Interpretation: Measures how far the landscape deviates from maximum diversity. High dominance indicates monoculture, urbanization pressure, or single land-cover dominance. Useful for detecting homogenization trends."
  metric_detail_evenness: "<b>Evenness (Equitability)</b><br/>Formula: E = SHDI / ln(n), where n is the number of classes.<br/>Range: 0 (highly unequal distribution) to 1 (all classes occupy equal areas).<br/>Interpretation: The normalized version of Shannon — independent of the number of classes. Allows direct comparison between landscapes with different numbers of classes.<br/>Reference: Pielou, E.C. (1966). The Measurement of Diversity in Different Types of Biological Collections. <i>Journal of Theoretical Biology</i>, 13, 131–144."
  metric_detail_patches: "<b>Total Patches (NP)</b><br/>Calculation: Count of spatially contiguous groups of pixels of the same class using 4-connectivity.<br/>Interpretation: More patches indicate a more fragmented landscape; fewer patches suggest more contiguous cover. Key indicator for habitat connectivity and biodiversity. A single patch of forest provides better habitat than many small fragments of the same total area.<br/>Reference: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS: Spatial Pattern Analysis Program for Quantifying Landscape Structure. USDA Forest Service, PNW-GTR-351."
  metric_detail_patch_density: "<b>Patch Density (PD)</b><br/>Formula: PD = NP / A, where NP is the number of patches and A is the total landscape area in km².<br/>Units: patches/km².<br/>Interpretation: Higher values indicate greater fragmentation intensity. Important for wildlife corridor planning and comparing areas of different sizes. PD normalizes fragmentation for area, enabling cross-site comparison.<br/>Reference: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  metric_detail_lpi: "<b>Largest Patch Index (LPI)</b><br/>Formula: LPI = (max_patch_area / total_area) × 100.<br/>Range: approaches 0% (many small patches) to 100% (entire landscape is one patch).<br/>Interpretation: Indicates spatial dominance — values above 50% suggest one class dominates. Key indicator for habitat area requirements and core area availability. Species requiring large contiguous areas are sensitive to low LPI values.<br/>Reference: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  metric_detail_edge_density: "<b>Edge Density (ED)</b><br/>Formula: ED = E / A, where E is the total edge length (m) between different classes and A is the landscape area in hectares.<br/>Units: m/ha.<br/>Interpretation: Higher values indicate more complex boundaries between cover types. Related to ecotone effects — edges create transition zones with unique ecological conditions. Sensitive to raster resolution (finer resolution detects more edges).<br/>Reference: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  metric_detail_mesh: "<b>Effective Mesh Size (MESH)</b><br/>Formula: MESH = Σ(aᵢ²) / A, where aᵢ is the area of each patch and A is the total landscape area.<br/>Units: m².<br/>Interpretation: Represents the expected area accessible to an organism placed at a random location. Higher values indicate less fragmentation and better connectivity. Important for conservation planning — landscapes with high MESH provide better habitat connectivity.<br/>Reference: Jaeger, J.A.G. (2000). Landscape division, splitting index, and effective mesh size. <i>Landscape Ecology</i>, 15(2), 115–130."
  metric_detail_aggregation: "<b>Aggregation Index (AI)</b><br/>Formula: AI = 100 × Σᵢ (gᵢᵢ / gᵢᵢ_max) × Pᵢ, where gᵢᵢ is the number of like-adjacencies for class i, gᵢᵢ_max is the maximum possible for a compact arrangement of those pixels, and Pᵢ is the class proportion.<br/>Range: 0% (maximum dispersion, like a checkerboard) to 100% (maximum aggregation, single compact block).<br/>Interpretation: Quantifies the degree of spatial aggregation of classes. High values indicate compact landscapes with little internal fragmentation; low values indicate highly interwoven mosaics. Complements LPI and Patch Density.<br/>Reference: He, H.S., DeZonia, B.E. & Mladenoff, D.J. (2000). An aggregation index (AI) to quantify spatial patterns of landscapes. <i>Landscape Ecology</i>, 15, 591–601."
  metric_detail_contagion: "<b>Contagion (CONTAG)</b><br/>Formula: CONTAG = 100 × [1 + (Σᵢⱼ Pᵢⱼ · ln Pᵢⱼ) / (2·ln n)], where Pᵢⱼ = pᵢ × gᵢⱼ / Σⱼgᵢⱼ, pᵢ is the class area proportion, gᵢⱼ counts both directions of orthogonal cell adjacency, and n is the number of classes. Background and external boundary edges are excluded.<br/>Range: 0–100%. Undefined (—) with fewer than two classes or no valid cell adjacencies.<br/>Interpretation: A classic landscape-ecology metric that jointly measures dispersion and interspersion. Integrates both dominance and aggregation into a single value. High values indicate few large, contiguous classes; low values indicate many fragmented, interwoven classes.<br/>Reference: O'Neill, R.V. et al. (1988). Indices of landscape pattern. <i>Landscape Ecology</i>, 1, 153–162; Li, H. & Reynolds, J.F. (1993). A new contagion index to quantify spatial patterns of landscapes. <i>Landscape Ecology</i>, 8, 155–162."
  metric_detail_shape: "<b>Mean Shape Index (SHAPE_MN)</b><br/>Per-patch formula: SHAPE = 0.25 × perimeter / √area (in raster, perimeter in pixel sides and area in pixels). SHAPE_MN is the mean across all patches in the landscape.<br/>Range: 1.0 (perfectly square patches) to increasing values as shapes become more irregular or elongated.<br/>Interpretation: Measures the average geometric complexity of patches. Values near 1.0 indicate compact patches; higher values indicate more sinuous boundaries or elongated patches. Relevant for assessing edge effects, anthropogenic fragmentation, and habitat suitability.<br/>Reference: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS: Spatial Pattern Analysis Program for Quantifying Landscape Structure. USDA Forest Service, PNW-GTR-351; Patton, D.R. (1975). A diversity index for quantifying habitat edge. <i>Wildlife Society Bulletin</i>, 3, 171–173."
  metric_detail_patch_area: "<b>Patch Area Statistics (AREA_MX, AREA_MN, AREA_MEAN)</b><br/>Computation: From all detected patches (4-connectivity) across all classes in the landscape, the maximum, minimum and arithmetic mean patch areas are derived, expressed in hectares.<br/>Interpretation: AREA_MX indicates the size of the single largest contiguous block, critical for species requiring large territories. AREA_MN reveals the size of residual fragments (isolated patches after degradation). AREA_MEAN summarises the typical patch size and, combined with patch density, describes the degree of fragmentation.<br/>Reference: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  temporal_series_section: "Temporal Series Analysis"
  compare_map_section: "Comparison Map"
  compare_map_caption: "Map of compared points with buffers, scale bar, and north arrow. Generated by LUMA."
  citation: "Suggested Citation"
  citation_text: "Analysis performed using LUMA v{version} (Gonçalves, A.M. & Gorni, G.R., UNIARA). Data source: {source}."

