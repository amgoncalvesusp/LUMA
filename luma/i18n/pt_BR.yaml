tips:
  latitude: "Latitude geográfica em graus decimais (-90 a 90). Hemisfério sul usa valores negativos. Exemplo: São Paulo = -23,55"
  longitude: "Longitude geográfica em graus decimais (-180 a 180). Hemisfério ocidental usa valores negativos. Exemplo: São Paulo = -46,63"
  radius: "Raio do buffer em metros ao redor da coordenada. Define a área circular de análise.\n\nRecomendações:\n• Análise urbana: 1.000 – 5.000 m\n• Estudos de bacia: 5.000 – 50.000 m\n• Análise regional: 10.000 – 100.000 m\n\nRaios maiores requerem mais tempo de processamento e dados."
  source_remote: "Datasets hospedados na nuvem, baixados sob demanda. Apenas a área dentro do seu buffer é baixada, não o dataset global inteiro. Requer conexão com a internet."
  source_local: "Use um arquivo raster (GeoTIFF, .tif) já baixado no seu computador. Útil para datasets que requerem download manual ou dados personalizados."
  legend: "O esquema de classificação que mapeia valores de pixel para categorias de cobertura do solo. Use 'Auto-detectar' quando a legenda corresponder ao nome do arquivo, ou selecione manualmente."
  year: "Ano de análise. Aplica-se apenas a datasets multi-temporais como MapBiomas (1985-2023). O arquivo raster deve corresponder ao ano selecionado."
  shannon: "O Índice de Diversidade de Shannon (SHDI) mede a diversidade de classes de cobertura.\n\nInterpretação:\n• 0 = Apenas uma classe presente (sem diversidade)\n• Valores maiores = Mais classes, mais uniformemente distribuídas\n• Faixa típica: 0,5 – 2,5\n\nÚtil para comparar complexidade da paisagem entre áreas."
  simpson: "O Índice de Diversidade de Simpson (SIDI) representa a probabilidade de dois pixels selecionados aleatoriamente pertencerem a classes diferentes.\n\nInterpretação:\n• 0 = Apenas uma classe (sem diversidade)\n• Próximo de 1 = Alta diversidade\n• Menos sensível a classes raras que Shannon"
  dominance: "A Dominância mede quão distante a paisagem está da diversidade máxima.\n\nInterpretação:\n• 0 = Todas as classes igualmente representadas\n• Valores maiores = Uma ou poucas classes dominam\n• Útil para detectar pressão de monocultura ou urbanização"
  evenness: "A Equitabilidade indica quão uniformemente distribuída é a área entre as classes presentes.\n\nInterpretação:\n• 0 = Distribuição altamente desigual\n• 1 = Todas as classes ocupam áreas iguais\n• Versão normalizada de Shannon (independente do número de classes)"
  patches: "O Número de Fragmentos (NP) conta os fragmentos separados de cada classe de cobertura.\n\nInterpretação:\n• Mais fragmentos = Paisagem mais fragmentada\n• Menos fragmentos = Cobertura mais contígua\n• Indicador importante para conectividade de habitat e biodiversidade"
  patch_density: "A Densidade de Fragmentos é o número de fragmentos por quilômetro quadrado.\n\nInterpretação:\n• Valores maiores = Mais fragmentado\n• Importante para planejamento de corredores ecológicos\n• Compare entre áreas de diferentes tamanhos"
  lpi: "O Índice do Maior Fragmento (LPI) é a porcentagem da paisagem ocupada pelo maior fragmento individual.\n\nInterpretação:\n• 100% = Toda a área é uma classe\n• Valores baixos = Nenhuma classe domina espacialmente\n• Indicador-chave para requisitos de área de habitat"
  edge_density: "A Densidade de Bordas mede o comprimento total de bordas (limites entre classes) por hectare.\n\nInterpretação:\n• Valores maiores = Limites mais complexos\n• Relacionada a efeitos de ecótono e habitats de borda\n• Sensível à resolução do raster"
  mesh_size: "O Tamanho Efetivo de Malha (MESH) quantifica a conectividade da paisagem.\n\nInterpretação:\n• Representa a área esperada acessível a um organismo colocado aleatoriamente\n• Valores maiores = Menos fragmentado, mais conectado\n• Importante para planejamento de conservação"
  aggregation_index: "O Índice de Agregação (AI) mede o quanto os pixels da mesma classe estão adjacentes entre si.\n\nInterpretação:\n• 0% = classes totalmente dispersas (padrão tipo damas)\n• 100% = classes totalmente agregadas (um único bloco)\n• Valores altos = paisagem compacta e pouco fragmentada\n• Complementa o LPI e a Densidade de Fragmentos"
  contagion: "O Contágio (CONTAG) mede simultaneamente a dispersão e o entrelaçamento das classes com base nas probabilidades de adjacência.\n\nInterpretação:\n• Valores altos = poucas classes dominantes formando grandes agregados\n• Valores baixos = muitas classes entrelaçadas em pequenos fragmentos\n• Amplamente usado em ecologia de paisagens para caracterizar estrutura espacial"
  mean_shape_index: "O Índice Médio de Forma (SHAPE_MN) mede a complexidade média dos fragmentos em relação a uma forma quadrada.\n\nInterpretação:\n• 1,0 = fragmentos perfeitamente quadrados/compactos\n• Valores maiores = formas mais alongadas ou irregulares\n• Útil para identificar bordas complexas e habitats com geometria mais dispersa"
  largest_patch_area: "Área do Maior Fragmento (AREA_MX) — tamanho absoluto, em hectares, do maior fragmento de qualquer classe presente na paisagem.\n\nInterpretação:\n• Valores altos = existe pelo menos um grande bloco contínuo (importante para espécies que exigem grandes áreas de habitat).\n• Complementa o LPI, que é o mesmo indicador em % da paisagem."
  smallest_patch_area: "Área do Menor Fragmento (AREA_MN) — tamanho, em hectares, do menor fragmento detectado na paisagem.\n\nInterpretação:\n• Valores muito baixos indicam presença de manchas residuais/fragmentos isolados.\n• Útil para detectar efeitos de insularização e degradação."
  isa_index: "Índice de Área Impermeável (ISA) — Walsh et al. (2005).\n\nMede a fração da paisagem coberta por superfícies impermeáveis (área urbana, vias, telhados).\n\nLimiares de bacia (Walsh et al. 2005):\n• < 2%  — Bacia de referência (hidrologia quase natural)\n• 2–10% — Bacia sensível (alteração hidrológica mensurável)\n• 10–25% — Bacia impactada (degradação significativa)\n• > 25% — Bacia gravemente degradada\n\nValores elevados de ISA estão fortemente associados ao aumento do escoamento superficial, pulsos hidrológicos e perda de biodiversidade ('síndrome do córrego urbano').\n\nReferência: Walsh, C.J. et al. (2005). The urban stream syndrome: current knowledge and the search for a cure. Journal of the North American Benthological Society, 24(3), 706–723."
  smallest_patch_pixel_bias: "⚠ O menor fragmento detectado (~{pixel_m:.0f} m de lado) pode corresponder a um único pixel. Este valor pode refletir a resolução do raster e não um fragmento real da paisagem."
  mean_patch_area: "Área Média dos Fragmentos (AREA_MEAN) — média aritmética do tamanho (hectares) de todos os fragmentos da paisagem.\n\nInterpretação:\n• Valores altos = fragmentos em média grandes (paisagem pouco fragmentada).\n• Valores baixos = muitos fragmentos pequenos (paisagem fragmentada).\n• Complementa Densidade de Fragmentos e SHAPE_MN."
  transition_matrix: "A Matriz de Transição mostra como a cobertura do solo mudou entre duas datas.\n\nLinhas = classe no tempo 1, Colunas = classe no tempo 2.\nValores na diagonal = área que permaneceu inalterada (persistência).\nFora da diagonal = área que transitou de uma classe para outra."
  fao_rate: "Taxa Anual de Desmatamento FAO: r = 1 - (A₂/A₁)^(1/(t₂-t₁))\n\nA métrica padrão usada pela Organização das Nações Unidas para Alimentação e Agricultura para quantificar a perda anual de floresta.\n\nInterpretação:\n• 0% = Sem mudança\n• Positivo = Perda de floresta\n• Negativo = Ganho de floresta (reflorestamento)"

