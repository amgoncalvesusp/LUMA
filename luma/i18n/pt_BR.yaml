  interpretation: "Guia de Interpretação"
  interpretation_text: "O Índice de Diversidade de Shannon (SHDI) mede a diversidade de classes — valores acima de 1,5 indicam alta heterogeneidade da paisagem. O Índice do Maior Fragmento (LPI) mostra dominância espacial — valores acima de 50% sugerem que uma classe domina a paisagem. A Densidade de Bordas reflete a complexidade dos limites — valores maiores indicam transições mais fragmentadas entre tipos de cobertura. A Densidade de Fragmentos quantifica a intensidade da fragmentação — compare entre locais para avaliar a continuidade relativa do habitat. O Índice de Agregação (AI) e o Contágio (CONTAG) descrevem o quanto as classes estão agregadas ou entrelaçadas — valores altos indicam paisagens compactas e bem agregadas. O Índice Médio de Forma (SHAPE_MN) caracteriza a geometria dos fragmentos — valores próximos de 1,0 indicam fragmentos compactos, enquanto valores maiores revelam formas irregulares ou alongadas."
  temporal_section: "Análise Temporal"
  temporal_period: "Período: {year1} → {year2}"
  temporal_persistence: "Persistência"
  temporal_net_change: "Mudança Líquida por Classe"
  temporal_transition: "Matriz de Transição (km²)"
  temporal_from: "De \\ Para"
  compare_section: "Comparação Multi-Ponto"
  compare_class_pct: "Distribuição de Classes (%)"
  compare_metrics: "Métricas de Paisagem por Ponto"
  compare_area: "Área (km²)"
  metric_detail_title: "Descrição das Métricas e Base de Cálculo"
  metric_detail_shannon: "<b>Índice de Diversidade de Shannon (SHDI)</b><br/>Fórmula: SHDI = −Σ(pᵢ × ln pᵢ), onde pᵢ é a proporção da paisagem ocupada pela classe i.<br/>Amplitude: 0 (classe única) a ln(n) (diversidade máxima com n classes).<br/>Interpretação: Valores acima de 1,5 indicam alta heterogeneidade da paisagem. Útil para comparar complexidade da paisagem entre diferentes locais ou períodos.<br/>Referência: Shannon, C.E. (1948). A Mathematical Theory of Communication. <i>Bell System Technical Journal</i>, 27, 379–423."
  metric_detail_simpson: "<b>Índice de Diversidade de Simpson (SIDI)</b><br/>Fórmula: SIDI = 1 − Σ(pᵢ²), onde pᵢ é a proporção da paisagem ocupada pela classe i.<br/>Amplitude: 0 (classe única) a 1 − 1/n (diversidade máxima).<br/>Interpretação: Representa a probabilidade de dois pixels selecionados aleatoriamente pertencerem a classes diferentes. Menos sensível a classes raras que Shannon. Valores acima de 0,7 indicam alta diversidade.<br/>Referência: Simpson, E.H. (1949). Measurement of Diversity. <i>Nature</i>, 163, 688."
  metric_detail_dominance: "<b>Dominância</b><br/>Fórmula: D = ln(n) − SHDI, onde n é o número de classes.<br/>Amplitude: 0 (todas as classes igualmente representadas) a ln(n) (uma classe ocupa 100%).<br/>Interpretação: Mede o quanto a paisagem se desvia da diversidade máxima. Alta dominância indica monocultura, pressão de urbanização ou dominância de uma única cobertura. Útil para detectar tendências de homogeneização."
  metric_detail_evenness: "<b>Equitabilidade</b><br/>Fórmula: E = SHDI / ln(n), onde n é o número de classes.<br/>Amplitude: 0 (distribuição altamente desigual) a 1 (todas as classes ocupam áreas iguais).<br/>Interpretação: Versão normalizada de Shannon — independente do número de classes. Permite comparação direta entre paisagens com diferentes números de classes.<br/>Referência: Pielou, E.C. (1966). The Measurement of Diversity in Different Types of Biological Collections. <i>Journal of Theoretical Biology</i>, 13, 131–144."
  metric_detail_patches: "<b>Total de Fragmentos (NP)</b><br/>Cálculo: Contagem de grupos espacialmente contíguos de pixels da mesma classe usando conectividade-4.<br/>Interpretação: Mais fragmentos indicam uma paisagem mais fragmentada; menos fragmentos sugerem cobertura mais contígua. Indicador-chave para conectividade de habitat e biodiversidade. Um único fragmento de floresta fornece melhor habitat do que muitos fragmentos pequenos da mesma área total.<br/>Referência: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS: Spatial Pattern Analysis Program for Quantifying Landscape Structure. USDA Forest Service, PNW-GTR-351."
  metric_detail_patch_density: "<b>Densidade de Fragmentos (PD)</b><br/>Fórmula: PD = NP / A, onde NP é o número de fragmentos e A é a área total da paisagem em km².<br/>Unidade: fragmentos/km².<br/>Interpretação: Valores maiores indicam maior intensidade de fragmentação. Importante para planejamento de corredores ecológicos e comparação de áreas de diferentes tamanhos. PD normaliza a fragmentação pela área, permitindo comparação entre locais.<br/>Referência: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  metric_detail_lpi: "<b>Índice do Maior Fragmento (LPI)</b><br/>Fórmula: LPI = (área_maior_fragmento / área_total) × 100.<br/>Amplitude: próximo de 0% (muitos fragmentos pequenos) a 100% (toda a paisagem é um único fragmento).<br/>Interpretação: Indica dominância espacial — valores acima de 50% sugerem que uma classe domina. Indicador-chave para requisitos de área de habitat e disponibilidade de área nuclear. Espécies que necessitam de grandes áreas contíguas são sensíveis a valores baixos de LPI.<br/>Referência: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  metric_detail_edge_density: "<b>Densidade de Bordas (ED)</b><br/>Fórmula: ED = E / A, onde E é o comprimento total de bordas (m) entre classes diferentes e A é a área da paisagem em hectares.<br/>Unidade: m/ha.<br/>Interpretação: Valores maiores indicam limites mais complexos entre tipos de cobertura. Relacionada a efeitos de ecótono — bordas criam zonas de transição com condições ecológicas únicas. Sensível à resolução do raster (maior resolução detecta mais bordas).<br/>Referência: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
  metric_detail_mesh: "<b>Tamanho Efetivo de Malha (MESH)</b><br/>Fórmula: MESH = Σ(aᵢ²) / A, onde aᵢ é a área de cada fragmento e A é a área total da paisagem.<br/>Unidade: m².<br/>Interpretação: Representa a área esperada acessível a um organismo colocado em uma localização aleatória. Valores maiores indicam menos fragmentação e melhor conectividade. Importante para planejamento de conservação — paisagens com alto MESH proporcionam melhor conectividade de habitat.<br/>Referência: Jaeger, J.A.G. (2000). Landscape division, splitting index, and effective mesh size. <i>Landscape Ecology</i>, 15(2), 115–130."
  metric_detail_aggregation: "<b>Índice de Agregação (AI)</b><br/>Fórmula: AI = 100 × Σᵢ (gᵢᵢ / gᵢᵢ_max) × Pᵢ, onde gᵢᵢ é o número de adjacências entre pixels da mesma classe i, gᵢᵢ_max é o máximo possível para um arranjo compacto desses pixels, e Pᵢ é a proporção da classe.<br/>Amplitude: 0% (máxima dispersão, como tabuleiro de damas) a 100% (máxima agregação, um único bloco compacto).<br/>Interpretação: Quantifica o grau de agregação espacial das classes. Valores altos indicam paisagens compactas com pouca fragmentação interna; valores baixos indicam mosaicos altamente entrelaçados. Complementa o LPI e a Densidade de Fragmentos.<br/>Referência: He, H.S., DeZonia, B.E. & Mladenoff, D.J. (2000). An aggregation index (AI) to quantify spatial patterns of landscapes. <i>Landscape Ecology</i>, 15, 591–601."
  metric_detail_contagion: "<b>Contágio (CONTAG)</b><br/>Fórmula: CONTAG = 100 × [1 + (Σᵢⱼ Pᵢⱼ · ln Pᵢⱼ) / (2·ln n)], onde Pᵢⱼ = pᵢ × gᵢⱼ / Σⱼgᵢⱼ, pᵢ é a proporção de área da classe, gᵢⱼ conta os dois sentidos das adjacências ortogonais e n é o número de classes. Fundo e bordas externas são excluídos.<br/>Amplitude: 0–100%. Indefinido (—) com menos de duas classes ou sem adjacências válidas.<br/>Interpretação: Métrica clássica da ecologia de paisagens que mede conjuntamente a dispersão e o entrelaçamento das classes. Integra tanto a dominância quanto a agregação em um único valor. Valores altos indicam poucas classes grandes e contíguas; valores baixos indicam muitas classes fragmentadas e misturadas.<br/>Referência: O'Neill, R.V. et al. (1988). Indices of landscape pattern. <i>Landscape Ecology</i>, 1, 153–162; Li, H. & Reynolds, J.F. (1993). A new contagion index to quantify spatial patterns of landscapes. <i>Landscape Ecology</i>, 8, 155–162."
  metric_detail_shape: "<b>Índice Médio de Forma (SHAPE_MN)</b><br/>Fórmula por fragmento: SHAPE = 0,25 × perímetro / √área (em raster, perímetro em lados de pixel e área em pixels). SHAPE_MN é a média sobre todos os fragmentos da paisagem.<br/>Amplitude: 1,0 (fragmentos perfeitamente quadrados) a valores crescentes conforme a forma se torna mais irregular ou alongada.<br/>Interpretação: Mede a complexidade geométrica média dos fragmentos. Formas próximas de 1,0 indicam fragmentos compactos; valores maiores indicam bordas mais sinuosas ou fragmentos alongados. Relevante para avaliar efeitos de borda, fragmentação antrópica e adequação de habitat.<br/>Referência: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS: Spatial Pattern Analysis Program for Quantifying Landscape Structure. USDA Forest Service, PNW-GTR-351; Patton, D.R. (1975). A diversity index for quantifying habitat edge. <i>Wildlife Society Bulletin</i>, 3, 171–173."
  metric_detail_patch_area: "<b>Estatísticas de Área dos Fragmentos (AREA_MX, AREA_MN, AREA_MEAN)</b><br/>Cálculo: A partir de todos os fragmentos detectados (conectividade-4) em todas as classes da paisagem, obtêm-se os valores máximo, mínimo e a média aritmética de suas áreas, expressos em hectares.<br/>Interpretação: AREA_MX indica o tamanho do maior bloco contínuo, crítico para espécies que requerem grandes territórios. AREA_MN revela o tamanho das manchas residuais (fragmentos isolados após degradação). AREA_MEAN sintetiza o tamanho típico do fragmento e, combinada com a densidade de fragmentos, descreve o grau de fragmentação.<br/>Referência: McGarigal, K. & Marks, B.J. (1995). FRAGSTATS."
