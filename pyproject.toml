[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luma"
version = "1.1.0"
description = "Land Use & Land Cover Analyzer — analyze raster datasets within coordinate-based buffer zones"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Adriano Marques Gonçalves", email = "adriano@uniara.edu.br" },
    { name = "Guilherme Rossi Gorni", email = "guilherme@uniara.edu.br" },
]
keywords = ["LULC", "land-use", "raster", "MapBiomas", "remote-sensing", "GIS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "exactextract>=0.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "httpx>=0.25",
    "PySide6>=6.6",
    "folium>=0.15",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "pyshp>=2.3",
    "simplekml>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.scripts]
luma = "luma.main:main"

[project.gui-scripts]
luma-gui = "luma.main:main"

[tool.hatch.build.targets.wheel]
packages = ["luma"]
